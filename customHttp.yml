# AWS Amplify custom headers (read from the repository root).
# https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
  # Optimized images: file names contain a content hash.
  - pattern: '/img/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # main.<hash>.css: file name contains a content hash.
  - pattern: '/styles/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Self-hosted fonts: versioned files that practically never change.
  - pattern: '/assets/fonts/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Original images (og:image, RSS) and scripts: not hashed, so revalidate sooner.
  - pattern: '/assets/images/*/*'
    headers:
      - key: Cache-Control
        value: public, max-age=604800
  - pattern: '/scripts/*'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
